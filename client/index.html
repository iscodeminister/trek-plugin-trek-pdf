<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trek PDF</title>
  <!-- trek:ui -->
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body { color: var(--text-primary); }
    .scroller { height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 20px 16px 32px; display: grid; gap: 16px; transition: opacity .15s; }
    .wrap.pending { opacity: 0; }
    .head h1 { margin: 2px 0 0; font-size: 22px; line-height: 1.2; }
    .grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    @media (max-width: 560px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .stat { padding: 12px 14px; }
    .stat b { display: block; font-size: 20px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .map { width: 100%; height: auto; display: block; border-radius: var(--r-md, 10px); background: var(--bg-secondary); }
    .map .grid-line { stroke: var(--border-primary); stroke-width: .6; }
    .map .grid-label { fill: var(--text-faint); font-size: 9px; }
    .map .label { font-size: 10px; font-weight: 600; fill: #111827; paint-order: stroke; stroke: #ffffff; stroke-width: 3px; stroke-linejoin: round; }
    .map .base-label { paint-order: stroke; stroke-linejoin: round; } /* halo colour comes from the style */
    .map .attr { font-size: 9px; fill: #4b5563; }
    .maphead { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
    .stylepick { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); }
    .stylepick select { width: auto; padding: 4px 8px; font-size: 13px; }
    .mapbox { position: relative; }
    .mapbox .map { touch-action: none; cursor: grab; user-select: none; }
    .mapbox .map.dragging { cursor: grabbing; }
    .zoom { position: absolute; top: 8px; left: 8px; display: flex; flex-direction: column; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.18); }
    .zoom button { width: 30px; height: 30px; border: 0; border-bottom: 1px solid #e5e7eb; background: #fff; color: #111827; font: 600 17px/1 system-ui, sans-serif; cursor: pointer; }
    .zoom button:last-child { border-bottom: 0; font-size: 15px; }
    .zoom button:hover { background: #f3f4f6; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .legend button { font: inherit; font-size: 12px; color: var(--text-muted); background: transparent; border: 1px solid var(--border-faint, transparent); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
    .legend button:hover { background: var(--bg-hover); color: var(--text-primary); }
    .legend button[aria-pressed="true"] { background: var(--accent-subtle); color: var(--text-primary); border-color: var(--border-primary); }
    .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-inline-end: 6px; vertical-align: 1px; }
    .opt { display: flex; align-items: center; gap: 10px; padding: 8px 0; cursor: pointer; font-size: 14px; }
    .opt input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
    .opt small { display: block; color: var(--text-muted); font-size: 12px; }
    .opt[aria-disabled="true"] { opacity: .5; }
    .bar { height: 8px; border-radius: 4px; background: var(--bg-tertiary); overflow: hidden; margin: 4px 0 10px; }
    .bar span { display: block; height: 100%; border-radius: 4px; }
    .cat { display: flex; justify-content: space-between; font-size: 13px; gap: 8px; }
    .cat span:last-child { color: var(--text-muted); white-space: nowrap; }
    .result { font-size: 13px; padding: 10px 12px; border-radius: var(--r-sm, 8px); background: var(--accent-subtle); word-break: break-word; }
    .empty { padding: 48px 16px; text-align: center; color: var(--text-muted); }
    #generate { width: 100%; justify-content: center; }
    .skel { height: 380px; border-radius: var(--r-md, 10px); }
  </style>
</head>
<body>
  <div class="scroller">
  <div class="wrap pending" id="wrap">
    <div class="head">
      <div class="trek-eyebrow" data-i18n="tripReport">Trip report</div>
      <h1 id="title" data-i18n="loading">Loading…</h1>
      <div class="trek-muted" id="dates"></div>
    </div>

    <div class="stats" id="stats">
      <div class="trek-card stat"><span class="trek-label" data-i18n="days">Days</span><b id="s-days">–</b></div>
      <div class="trek-card stat"><span class="trek-label" data-i18n="plannedStops">Planned stops</span><b id="s-stops">–</b></div>
      <div class="trek-card stat"><span class="trek-label" data-i18n="stays">Stays</span><b id="s-lodging">–</b></div>
      <div class="trek-card stat"><span class="trek-label" data-i18n="totalCost">Total cost</span><b id="s-cost">–</b></div>
    </div>

    <div class="grid">
      <div class="trek-card" style="padding: 14px">
        <div class="maphead">
          <div class="trek-sectionhead" data-i18n="mapOverview">Map overview</div>
          <label class="stylepick" id="style-row" hidden><span data-i18n="mapStyle">Map style</span>
            <select id="style" class="trek-input"></select></label>
        </div>
        <div id="map" class="mapbox"><div class="trek-skeleton skel"></div></div>
        <div class="legend" id="legend"></div>
      </div>

      <div class="trek-stack">
        <div class="trek-card" style="padding: 14px">
          <div class="trek-sectionhead" data-i18n="include">Include</div>
          <label class="opt"><input type="checkbox" name="section" value="map" checked /><span><span data-i18n="mapOverview">Map overview</span><small data-i18n="mapHint">Whole trip + a map per day</small></span></label>
          <label class="opt"><input type="checkbox" name="section" value="itinerary" checked /><span><span data-i18n="itinerary">Itinerary</span><small data-i18n="itineraryHint">Day by day stops, times and notes</small></span></label>
          <label class="opt"><input type="checkbox" name="section" value="lodging" checked /><span><span data-i18n="accommodation">Accommodation</span><small id="lodging-hint" data-i18n="accommodationHint">Check-in, check-out, nights</small></span></label>
          <label class="opt" id="costs-opt"><input type="checkbox" name="section" value="costs" checked /><span><span data-i18n="costs">Costs</span><small id="costs-hint" data-i18n="costsHint">Totals by category + every expense</small></span></label>

          <div class="trek-sectionhead" style="margin: 12px 0 8px" data-i18n="paper">Paper</div>
          <div class="trek-segmented" id="paper">
            <button type="button" data-v="a4" aria-pressed="true">A4</button>
            <button type="button" data-v="letter" aria-pressed="false" data-i18n="letter">Letter</button>
          </div>

          <div style="margin-top: 16px">
            <button class="trek-btn trek-btn--primary" id="generate" disabled data-i18n="generate">Generate PDF</button>
          </div>
          <p class="trek-faint" style="font-size: 12px; margin: 10px 0 0" data-i18n="savedNote">The PDF is saved to this trip’s Files, where everyone on the trip can open or download it.</p>
          <div class="result" id="result" hidden></div>
        </div>

        <div class="trek-card" style="padding: 14px" id="costs-card" hidden>
          <div class="trek-sectionhead" style="margin-bottom: 10px" data-i18n="costs">Costs</div>
          <div id="costs"></div>
        </div>
      </div>
    </div>
  </div>
  </div>

  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var ctx = null, paper = 'a4', loadedFor = null, summary = null, view = -1;
      var S = {}, plural = null, LOCALE = 'en-US';
      var COLORS = ['#e11d48', '#2563eb', '#16a34a', '#d97706', '#7c3aed', '#0891b2', '#db2777', '#65a30d', '#ea580c', '#4f46e5'];
      var NS = 'http://www.w3.org/2000/svg';

      // ---- i18n: strings come from the server (one table shared with the PDF).
      function t(key, vars) {
        var s = S[key] != null ? S[key] : key;
        return String(s).replace(/\{(\w+)\}/g, function (m, k) { return vars && vars[k] != null ? vars[k] : m; });
      }
      function tn(key, n) {
        var forms = S[key] || {}, cat = plural ? plural.select(n) : 'other';
        return String(forms[cat] || forms.other || '{n}').replace('{n}', n.toLocaleString(LOCALE));
      }
      function applyI18n(b) {
        S = b.strings; LOCALE = b.locale;
        try { plural = new Intl.PluralRules(LOCALE); } catch (e) { plural = null; }
        document.documentElement.lang = b.lang;
        document.documentElement.dir = b.dir;
        document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
      }
      function reveal() { $('wrap').classList.remove('pending'); }

      function el(tag, attrs, parent) {
        var e = document.createElementNS(NS, tag);
        for (var k in attrs) e.setAttribute(k, attrs[k]);
        if (parent) parent.appendChild(e);
        return e;
      }
      function opts() {
        var f = (ctx && ctx.formats) || {};
        return { tripId: ctx && ctx.tripId, lang: (ctx && ctx.locale) || f.locale || 'en', locale: f.locale, currency: f.currency, timeZone: f.timezone };
      }
      function unwrap(data) {
        if (data && data.error) throw new Error(data.error);
        return data;
      }

      // ---- Interactive map. The server sends lat/lng for every marker and route; the tab
      // projects them itself (Web Mercator) so zoom and pan are instant, and asks the server
      // for a fresh vector basemap once the view settles. Until it arrives, the previous
      // basemap is scaled/shifted into place so nothing jumps.
      var R = 6371008.8, K_MIN = 512 * 2 / (2 * Math.PI), K_MAX = 512 * Math.pow(2, 17) / (2 * Math.PI);
      var M = null, cur = null, svg = null, gBase = null, gTop = null, baseView = null, baseHalo = '#ffffff';
      var baseTimer = null, baseSeq = 0, baseCache = {}, baseKeys = [], style = 'bright', styleTouched = false;
      // Zoom state per map view (-1 = all days, else day index): [cx, cy, k]. Kept in the
      // trip-scoped tab session so it survives switching TREK tabs, and sent with the
      // report so the PDF maps show the same area.
      var views = {}, viewsLoaded = {}, saveTimer = null;
      function remember() {
        var v = view, val = [+cur.cx.toFixed(7), +cur.cy.toFixed(7), +cur.k.toFixed(2)];
        views[v] = val;
        clearTimeout(saveTimer);
        saveTimer = setTimeout(function () { if (trek.session) trek.session.set('view:' + v, val, { scope: 'trip' }).catch(function () {}); }, 300);
      }
      function forget() {
        delete views[view];
        if (trek.session) trek.session.remove('view:' + view, { scope: 'trip' }).catch(function () {});
      }
      // Saved zooms of views not opened yet still belong in the PDF → read them all up front.
      function preloadViews(days) {
        if (!trek.session) return;
        for (var v = -1; v < days; v++) (function (v) {
          if (views[v] || viewsLoaded[v]) return;
          viewsLoaded[v] = true;
          trek.session.get('view:' + v, { scope: 'trip' }).then(function (val) { if (validView(val) && !views[v]) views[v] = val; }).catch(function () {});
        })(v);
      }
      function validView(v) { return Array.isArray(v) && v.length === 3 && v.every(function (n) { return typeof n === 'number' && isFinite(n); }) && v[2] > 0; }
      var STYLE_NAMES = { positron: 'Positron', bright: 'Bright', liberty: 'Liberty', dark: 'Dark', fiord: 'Fiord', osm: 'OpenStreetMap' };
      var mx = function (lng) { return lng * Math.PI / 180; };
      var my = function (lat) { return Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360)); };
      var clamp = function (v, lo, hi) { return Math.min(hi, Math.max(lo, v)); };
      function P(ll) { return [M.w / 2 + (mx(ll[1]) - cur.cx) * cur.k, M.h / 2 - (my(ll[0]) - cur.cy) * cur.k]; }

      function scaleBar() {
        var lat = Math.atan(Math.exp(cur.cy)) * 360 / Math.PI - 90;
        var mPerPt = R * Math.cos(lat * Math.PI / 180) / cur.k, target = (M.w / 5) * mPerPt;
        var mag = Math.pow(10, Math.floor(Math.log10(target)));
        var dist = [1, 2, 5, 10].map(function (f) { return f * mag; }).filter(function (v) { return v <= target; }).pop() || mag;
        return { len: dist / mPerPt, label: dist >= 1000 ? (dist / 1000).toLocaleString(LOCALE) + ' km' : dist.toLocaleString(LOCALE) + ' m' };
      }

      function markerBoxes() {
        return M.markers.map(function (k) { var p = P([k.lat, k.lng]); return [p[0] - 12, p[1] - 12, p[0] + 12, p[1] + 12]; })
          .concat([[M.w - 150, M.h - 30, M.w, M.h], [0, M.h - 16, 230, M.h], [0, 0, 44, 110]]);
      }

      function requestBase(delay) {
        clearTimeout(baseTimer);
        if (!summary || !summary.basemap || !svg) return;
        baseTimer = setTimeout(function () {
          var v = { cx: cur.cx, cy: cur.cy, k: cur.k }, seq = ++baseSeq, map = svg;
          var key = [style, v.cx.toFixed(6), v.cy.toFixed(6), v.k.toFixed(1), LOCALE].join('|');
          if (!baseCache[key]) {
            var body = opts(); body.view = v; body.style = style; body.reserved = markerBoxes();
            body.scale = Math.min(2, window.devicePixelRatio || 1); // raster style resolution
            baseCache[key] = trek.invoke('/basemap', { method: 'POST', body: body })
              .then(unwrap).then(function (r) { return r && r.basemap ? r.basemap : null; })
              .catch(function () { delete baseCache[key]; return null; });
            baseKeys.push(key);
            if (baseKeys.length > 24) delete baseCache[baseKeys.shift()];
          }
          baseCache[key].then(function (b) {
            if (!b || seq !== baseSeq || map !== svg) return;
            paintBase(b);
            baseView = v;
            redraw();
          });
        }, delay);
      }

      function paintBase(b) {
        gBase.textContent = '';
        baseHalo = b.halo || '#ffffff';
        svg.style.background = b.background;
        el('rect', { x: -M.w, y: -M.h, width: M.w * 3, height: M.h * 3, fill: b.background }, gBase);
        if (b.image) { // raster style (OpenStreetMap): one image for the whole view
          el('image', { href: b.image, x: 0, y: 0, width: M.w, height: M.h, preserveAspectRatio: 'none' }, gBase);
          gBase.dataset.attribution = b.attribution;
          return;
        }
        b.layers.forEach(function (l) {
          if (l.kind === 'fill') el('path', { d: l.d, fill: l.color }, gBase);
          else {
            var a = { d: l.d, fill: 'none', stroke: l.color, 'stroke-width': l.width, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' };
            if (l.dash) a['stroke-dasharray'] = l.dash.join(' ');
            el('path', a, gBase);
          }
        });
        b.labels.forEach(function (l) {
          el('text', { x: l.x, y: l.y, 'text-anchor': 'middle', 'font-size': l.size, 'font-weight': l.bold ? 700 : 400, fill: l.color, stroke: baseHalo, class: 'base-label', 'stroke-width': l.size * 0.32 }, gBase).textContent = l.text;
        });
        gBase.dataset.attribution = b.attribution;
      }

      function redraw() {
        if (!svg) return;
        // Stale basemap → transform it from the view it was rendered for to the current one.
        if (baseView) {
          var s = cur.k / baseView.k;
          var tx = M.w / 2 + (baseView.cx - cur.cx) * cur.k - (M.w / 2) * s;
          var ty = M.h / 2 - (baseView.cy - cur.cy) * cur.k - (M.h / 2) * s;
          gBase.setAttribute('transform', 'translate(' + tx + ' ' + ty + ') scale(' + s + ')');
        }
        gTop.textContent = '';
        (M.links || []).forEach(function (l) {
          el('polyline', { points: l.ll.map(P).map(function (p) { return p.join(','); }).join(' '), fill: 'none', stroke: '#64748b', 'stroke-width': 1.5, 'stroke-dasharray': '5 4' }, gTop);
        });
        M.routes.forEach(function (r) {
          var pts = r.ll.map(P).map(function (p) { return p.join(','); }).join(' ');
          el('polyline', { points: pts, fill: 'none', stroke: '#ffffff', 'stroke-width': 6, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, gTop);
          el('polyline', { points: pts, fill: 'none', stroke: r.color, 'stroke-width': 2.5, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, gTop);
        });
        var placed = M.markers.map(function (k) { var p = P([k.lat, k.lng]); return { k: k, x: p[0], y: p[1] }; });
        placed.forEach(function (o) {
          var k = o.k, g = el('g', {}, gTop);
          el('title', {}, g).textContent = (k.day ? t('dayN', { n: k.day }) : t('notScheduled')) + ' · ' + k.label;
          if (k.n === null) { el('circle', { cx: o.x, cy: o.y, r: 4.5, fill: k.color, stroke: '#fff', 'stroke-width': 1.5 }, g); return; }
          el('circle', { cx: o.x, cy: o.y, r: 9, fill: k.color, stroke: '#fff', 'stroke-width': 2 }, g);
          el('text', { x: o.x, y: o.y + 3.5, 'text-anchor': 'middle', 'font-size': 10, 'font-weight': 700, fill: '#fff' }, g).textContent = k.n;
        });
        if (placed.length <= 40) {
          var boxes = [];
          placed.slice().reverse().forEach(function (o) {
            var label = o.k.label.length > 22 ? o.k.label.slice(0, 21) + '…' : o.k.label;
            var w = label.length * 6 + 4, b = [o.x + 12, o.y - 7, o.x + 12 + w, o.y + 7];
            if (o.x < 0 || o.y < 0 || o.x > M.w || o.y > M.h || b[2] > M.w) return;
            if (boxes.some(function (q) { return !(b[2] < q[0] || b[0] > q[2] || b[3] < q[1] || b[1] > q[3]); })) return;
            boxes.push(b);
            el('text', { x: o.x + 13, y: o.y + 3.5, class: 'label' }, gTop).textContent = label;
          });
        }
        var sb = scaleBar(), sx = M.w - sb.len - 14, sy = M.h - 12;
        el('rect', { x: sx - 6, y: sy - 18, width: sb.len + 12, height: 23, rx: 4, fill: '#ffffff', opacity: 0.9 }, gTop);
        el('polyline', { points: [sx, sy - 4, sx, sy, sx + sb.len, sy, sx + sb.len, sy - 4].join(' '), fill: 'none', stroke: '#111827', 'stroke-width': 1.5 }, gTop);
        el('text', { x: sx + sb.len / 2, y: sy - 6, 'text-anchor': 'middle', 'font-size': 10, 'font-weight': 600, fill: '#111827' }, gTop).textContent = sb.label;
        if (gBase.dataset.attribution) {
          var attr = gBase.dataset.attribution;
          el('rect', { x: 0, y: M.h - 14, width: attr.length * 5.1 + 10, height: 14, fill: '#ffffff', opacity: 0.85 }, gTop);
          el('text', { x: 4, y: M.h - 4, class: 'attr' }, gTop).textContent = attr;
        }
      }

      function setView(v, delay, quiet) {
        var k = clamp(v.k, K_MIN, K_MAX);
        cur = { cx: clamp(v.cx, -Math.PI, Math.PI), cy: clamp(v.cy, -3.1, 3.1), k: k };
        if (!quiet) remember();
        redraw();
        requestBase(delay);
      }
      // Zoom by factor f keeping the map point under (px, py) fixed.
      function zoomAt(f, px, py) {
        var k2 = clamp(cur.k * f, K_MIN, K_MAX);
        var X = cur.cx + (px - M.w / 2) / cur.k, Y = cur.cy - (py - M.h / 2) / cur.k;
        setView({ cx: X - (px - M.w / 2) / k2, cy: Y + (py - M.h / 2) / k2, k: k2 }, 250);
      }
      function svgPoint(e) {
        var r = svg.getBoundingClientRect();
        return [(e.clientX - r.left) * M.w / r.width, (e.clientY - r.top) * M.h / r.height];
      }

      function attachInteractions() {
        var ptrs = {}, last = null;
        svg.addEventListener('pointerdown', function (e) {
          svg.setPointerCapture(e.pointerId);
          ptrs[e.pointerId] = svgPoint(e);
          svg.classList.add('dragging');
        });
        svg.addEventListener('pointermove', function (e) {
          if (!(e.pointerId in ptrs)) return;
          var p = svgPoint(e), ids = Object.keys(ptrs);
          if (ids.length === 1) {
            var q = ptrs[e.pointerId];
            cur = { cx: clamp(cur.cx - (p[0] - q[0]) / cur.k, -Math.PI, Math.PI), cy: clamp(cur.cy + (p[1] - q[1]) / cur.k, -3.1, 3.1), k: cur.k };
            ptrs[e.pointerId] = p;
            redraw();
          } else if (ids.length === 2) { // pinch
            var other = ptrs[ids[0] == e.pointerId ? ids[1] : ids[0]];
            var d0 = Math.hypot(ptrs[e.pointerId][0] - other[0], ptrs[e.pointerId][1] - other[1]);
            var d1 = Math.hypot(p[0] - other[0], p[1] - other[1]);
            ptrs[e.pointerId] = p;
            if (d0 > 0) zoomAt(d1 / d0, (p[0] + other[0]) / 2, (p[1] + other[1]) / 2);
          }
        });
        function up(e) {
          if (!(e.pointerId in ptrs)) return;
          delete ptrs[e.pointerId];
          if (!Object.keys(ptrs).length) { svg.classList.remove('dragging'); remember(); requestBase(150); }
        }
        svg.addEventListener('pointerup', up);
        svg.addEventListener('pointercancel', up);
        svg.addEventListener('dblclick', function (e) { var p = svgPoint(e); zoomAt(e.shiftKey ? 0.5 : 2, p[0], p[1]); });
        // Ctrl/⌘ + wheel (and trackpad pinch, which arrives as ctrl+wheel) zooms; a plain
        // wheel keeps scrolling the page.
        svg.addEventListener('wheel', function (e) {
          if (!e.ctrlKey && !e.metaKey) return;
          e.preventDefault();
          var p = svgPoint(e);
          zoomAt(Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0025)), p[0], p[1]);
        }, { passive: false });
      }

      function drawMap(m) {
        var box = $('map');
        box.textContent = '';
        M = m; svg = null; baseView = null;
        if (m.empty) {
          var d = document.createElement('div');
          d.className = 'empty';
          d.textContent = t('noCoords');
          box.appendChild(d);
          return;
        }
        cur = { cx: m.view.cx, cy: m.view.cy, k: m.view.k };
        svg = el('svg', { viewBox: '0 0 ' + m.w + ' ' + m.h, class: 'map', role: 'img', 'aria-label': t('mapOverview'), direction: 'ltr' }, box);
        gBase = el('g', {}, svg);
        gTop = el('g', {}, svg);
        var zc = document.createElement('div');
        zc.className = 'zoom';
        [['+', 'zoomIn', function () { zoomAt(2, M.w / 2, M.h / 2); }],
         ['−', 'zoomOut', function () { zoomAt(0.5, M.w / 2, M.h / 2); }],
         ['⤢', 'resetView', function () { forget(); setView(M.view, 0, true); }]].forEach(function (c) {
          var b = document.createElement('button');
          b.type = 'button'; b.textContent = c[0]; b.title = t(c[1]); b.setAttribute('aria-label', t(c[1]));
          b.addEventListener('click', c[2]);
          zc.appendChild(b);
        });
        box.appendChild(zc);
        attachInteractions();
        // Restore this view's saved zoom (memory first, then the tab session) before the
        // first basemap request, so nothing renders twice.
        var v = view, map = svg;
        function start(saved) {
          if (map !== svg) return;
          if (validView(saved)) { views[v] = saved; cur = { cx: saved[0], cy: saved[1], k: saved[2] }; }
          redraw();
          requestBase(0);
        }
        if (views[v] || !trek.session) start(views[v]);
        else {
          viewsLoaded[v] = true;
          trek.session.get('view:' + v, { scope: 'trip' }).then(start, function () { start(null); });
        }
      }

      // The design kit mirrors a <select> into its own listbox on 'change'; send a marked
      // one so our handler can tell it apart from a user pick.
      function setSelect(sel, value) {
        sel.value = value;
        var ev = new Event('change');
        ev.fromCode = true;
        sel.dispatchEvent(ev);
      }

      function setupStyles(s) {
        var sel = $('style');
        sel.textContent = '';
        (s.styles || []).forEach(function (id) {
          var o = document.createElement('option');
          o.value = id; o.textContent = STYLE_NAMES[id] || id;
          sel.appendChild(o);
        });
        $('style-row').hidden = !s.basemap;
        if (!styleTouched) style = s.style;
        setSelect(sel, style);
        // Remember the pick for this TREK tab.
        if (!styleTouched && trek.session) {
          trek.session.get('mapStyle').then(function (v) {
            if (!styleTouched && v && s.styles.indexOf(v) >= 0 && v !== style) { style = v; setSelect(sel, v); requestBase(0); }
          }).catch(function () {});
        }
      }

      // Legend doubles as a day picker: "All days" or zoom into one day's own map.
      function showView(v) {
        view = v;
        var m = v < 0 ? summary.map : (summary.dayMaps && summary.dayMaps[v]) || summary.map;
        drawMap(m);
        var lg = $('legend');
        lg.textContent = '';
        var items = [{ label: t('allDays'), color: null, v: -1 }].concat(summary.map.legend.map(function (l, i) { return { label: l.label + ' (' + l.count + ')', color: l.color, v: i }; }));
        items.forEach(function (it) {
          var b = document.createElement('button');
          b.type = 'button';
          b.setAttribute('aria-pressed', String(it.v === view));
          if (it.color) { var dot = document.createElement('i'); dot.style.background = it.color; b.appendChild(dot); }
          b.appendChild(document.createTextNode(it.label));
          b.addEventListener('click', function () { showView(it.v); });
          lg.appendChild(b);
        });
      }

      function render(s) {
        applyI18n(s.i18n);
        summary = s;
        $('title').textContent = s.title;
        $('dates').textContent = [s.dateRange, s.duration ? tn('nDays', s.duration) : ''].filter(Boolean).join(' · ') || t('noDates');
        $('s-days').textContent = s.days.toLocaleString(LOCALE);
        $('s-stops').textContent = s.stops.toLocaleString(LOCALE) + (s.unscheduled ? ' (+' + s.unscheduled.toLocaleString(LOCALE) + ')' : '');
        $('s-lodging').textContent = s.lodging.toLocaleString(LOCALE);
        $('s-cost').textContent = s.costs && s.costs.length ? s.costs[0].formatted + (s.costs.length > 1 ? ' +' : '') : '—';
        $('s-cost').title = s.costs ? s.costs.map(function (c) { return c.formatted; }).join(' + ') : '';
        if (view >= s.days) view = -1;
        setupStyles(s);
        preloadViews(s.days);
        showView(view);

        // Costs
        var costOpt = $('costs-opt'), costBox = $('costs');
        costOpt.querySelector('input').disabled = !s.costsEnabled;
        costOpt.setAttribute('aria-disabled', String(!s.costsEnabled));
        $('costs-hint').textContent = s.costsEnabled ? (s.costItems ? tn('nExpenses', s.costItems) : t('noExpenses')) : t('costsOff');
        $('lodging-hint').textContent = s.lodging ? tn('nStays', s.lodging) : t('noLodging');
        costBox.textContent = '';
        $('costs-card').hidden = !(s.costs && s.costs.length);
        (s.costs || []).forEach(function (g, gi) {
          var head = document.createElement('div');
          head.className = 'cat';
          head.innerHTML = '<strong></strong><strong></strong>';
          head.children[0].textContent = s.costs.length > 1 ? t('totalCur', { cur: g.currency }) : t('total');
          head.children[1].textContent = g.formatted;
          head.style.marginBottom = '8px';
          if (gi) head.style.marginTop = '8px';
          costBox.appendChild(head);
          var max = Math.max.apply(null, g.categories.map(function (c) { return c.total; }).concat([1]));
          g.categories.forEach(function (c, i) {
            var row = document.createElement('div'); row.className = 'cat';
            row.innerHTML = '<span></span><span></span>';
            row.children[0].textContent = c.name; row.children[1].textContent = c.formatted;
            var bar = document.createElement('div'); bar.className = 'bar';
            var fill = document.createElement('span');
            fill.style.width = Math.max(2, Math.round(100 * Math.max(0, c.total) / max)) + '%';
            fill.style.background = COLORS[i % COLORS.length];
            bar.appendChild(fill);
            costBox.appendChild(row); costBox.appendChild(bar);
          });
        });
        $('generate').disabled = false;
        reveal();
      }

      function load() {
        var o = opts();
        if (!o.tripId) { $('title').textContent = t('openTrip'); reveal(); return; }
        var key = JSON.stringify(o);
        if (key === loadedFor) return;
        if (loadedFor && JSON.parse(loadedFor).tripId !== o.tripId) { views = {}; viewsLoaded = {}; }
        loadedFor = key;
        baseCache = {}; baseKeys = [];
        trek.invoke('/summary', { method: 'POST', body: o }).then(unwrap).then(render).catch(function (e) {
          loadedFor = null;
          $('title').textContent = t('couldNotLoad');
          $('map').textContent = '';
          var d = document.createElement('div'); d.className = 'empty'; d.textContent = e.message; $('map').appendChild(d);
          reveal();
          trek.notify('error', e.message);
        });
      }

      document.querySelectorAll('#paper button').forEach(function (b) {
        b.addEventListener('click', function () {
          paper = b.dataset.v;
          document.querySelectorAll('#paper button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
        });
      });

      $('style').addEventListener('change', function (e) {
        if (e.fromCode) return;
        style = e.target.value;
        styleTouched = true;
        if (trek.session) trek.session.set('mapStyle', style).catch(function () {});
        requestBase(0);
      });

      $('generate').addEventListener('click', function () {
        var sections = Array.prototype.filter.call(document.querySelectorAll('input[name=section]'), function (i) { return i.checked && !i.disabled; }).map(function (i) { return i.value; });
        if (!sections.length) { trek.notify('warning', t('pickSection')); return; }
        var btn = $('generate'), res = $('result');
        btn.disabled = true; btn.textContent = t('generating'); res.hidden = true;
        var body = opts(); body.sections = sections; body.paper = paper; body.style = style; body.views = views;
        trek.invoke('/report', { method: 'POST', body: body }).then(unwrap).then(function (r) {
          var kb = Math.max(1, Math.round(r.file.size / 1024));
          res.hidden = false;
          res.textContent = t('savedTo', { name: r.file.name, kb: kb.toLocaleString(LOCALE) });
          trek.notify('success', t('savedToast'));
        }).catch(function (e) {
          res.hidden = false;
          res.textContent = t('couldNotCreate', { msg: e.message });
          trek.notify('error', e.message);
        }).then(function () { btn.disabled = false; btn.textContent = t('generate'); });
      });

      // Never stay invisible if the host is slow to send a context.
      setTimeout(reveal, 3000);
      trek.onContext(function (c) { ctx = c; load(); });
    })();
  </script>
</body>
</html>
