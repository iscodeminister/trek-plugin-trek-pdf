<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trek PDF</title>
  <!-- trek:ui -->
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body { color: var(--text-primary); }
    .scroller { height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 20px 16px 32px; display: grid; gap: 16px; transition: opacity .15s; }
    .wrap.pending { opacity: 0; }
    .head h1 { margin: 2px 0 0; font-size: 22px; line-height: 1.2; }
    .grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
    .side { position: sticky; top: 16px; }
    @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } .side { position: static; } }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    @media (max-width: 560px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .stat { padding: 12px 14px; }
    .stat b { display: block; font-size: 20px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card { padding: 14px; }
    /* ---- map card */
    .maphead { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; margin-bottom: 10px; }
    .maphead .trek-sectionhead { margin: 0; }
    .viewname { font-size: 15px; font-weight: 600; margin-top: 2px; overflow-wrap: anywhere; }
    .viewstate { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); min-height: 26px; }
    .viewstate .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); flex: none; }
    .viewstate.saved .dot { background: var(--success, #16a34a); }
    .viewstate button { font: inherit; font-size: 12px; color: var(--text-secondary); background: transparent; border: 1px solid var(--border-primary); border-radius: 999px; padding: 2px 10px; cursor: pointer; }
    .viewstate button:hover { background: var(--bg-hover); color: var(--text-primary); }
    .mapbox { position: relative; border-radius: var(--r-md, 10px); overflow: hidden; background: var(--bg-secondary); }
    .map { width: 100%; height: auto; display: block; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
    .map.dragging { cursor: grabbing; }
    .map:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .map .label { font-size: 10px; font-weight: 600; fill: #111827; paint-order: stroke; stroke: #ffffff; stroke-width: 3px; stroke-linejoin: round; }
    .map .base-label { paint-order: stroke; stroke-linejoin: round; } /* halo colour comes from the style */
    .map .attr { font-size: 9px; fill: #4b5563; }
    .map .attr-badge { cursor: pointer; }
    .ctl { position: absolute; display: flex; flex-direction: column; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.2); background: #fff; }
    .ctl button { width: 32px; height: 32px; border: 0; border-bottom: 1px solid #e5e7eb; background: #fff; color: #111827; font: 600 17px/1 system-ui, sans-serif; cursor: pointer; display: grid; place-items: center; padding: 0; }
    .ctl button:last-child { border-bottom: 0; }
    .ctl button:hover { background: #f3f4f6; }
    .ctl svg { width: 16px; height: 16px; }
    .zoom { top: 8px; left: 8px; }
    .layers { top: 8px; right: 8px; }
    /* map style picker: a button on the map opening swatches */
    .stylebtn { width: auto !important; height: 32px; padding: 0 10px 0 4px !important; display: flex !important; align-items: center; gap: 6px; font: 600 12px/1 system-ui, sans-serif !important; }
    .stylebtn .sw { width: 24px; height: 24px; border-radius: 5px; overflow: hidden; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
    .stylepop { position: absolute; top: 46px; right: 8px; z-index: 3; width: min(300px, calc(100% - 16px)); padding: 10px; border-radius: 10px; background: var(--bg-card, #fff); color: var(--text-primary); box-shadow: 0 6px 24px rgba(0,0,0,.22); border: 1px solid var(--border-primary); }
    .stylepop[hidden] { display: none; }
    .stylepop .ttl { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-muted); margin: 0 2px 8px; }
    .stylegrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .styleopt { font: inherit; font-size: 12px; color: var(--text-secondary); background: transparent; border: 0; padding: 0; cursor: pointer; text-align: center; border-radius: 8px; }
    .styleopt .sw { display: block; width: 100%; aspect-ratio: 3 / 2; border-radius: 7px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); margin-bottom: 4px; }
    .styleopt[aria-checked="true"] { color: var(--text-primary); font-weight: 600; }
    .styleopt[aria-checked="true"] .sw { box-shadow: 0 0 0 2px var(--accent); }
    .styleopt:hover .sw { box-shadow: 0 0 0 2px var(--border-primary); }
    .styleopt[aria-checked="true"]:hover .sw { box-shadow: 0 0 0 2px var(--accent); }
    .sw svg { width: 100%; height: 100%; display: block; }
    .maphint { font-size: 11px; color: var(--text-faint); margin-top: 8px; }
    /* view picker under the map */
    .pick { display: grid; gap: 8px; margin-top: 10px; }
    .pickrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .pickrow > span { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-faint); margin-inline-end: 2px; }
    .pickrow button { font: inherit; font-size: 12px; color: var(--text-muted); background: transparent; border: 1px solid var(--border-faint, transparent); border-radius: 999px; padding: 4px 10px; cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pickrow button:hover { background: var(--bg-hover); color: var(--text-primary); }
    .pickrow button[aria-pressed="true"] { background: var(--accent-subtle); color: var(--text-primary); border-color: var(--border-primary); }
    .pickrow i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-inline-end: 6px; vertical-align: 1px; }
    .pickrow b { font-weight: 600; margin-inline-start: 4px; font-size: 10px; color: var(--success, #16a34a); }
    .opts { display: grid; gap: 2px; margin-top: 6px; }
    .opt { display: flex; align-items: center; gap: 10px; padding: 6px 0; cursor: pointer; font-size: 14px; }
    .optrow { display: grid; gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border-primary); }
    .optrow > div { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .optrow .trek-sectionhead { margin: 0; }
    .optrow > div[hidden] { display: none; }
    .opt input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
    .opt small { display: block; color: var(--text-muted); font-size: 12px; }
    .opt[aria-disabled="true"] { opacity: .5; }
    .bar { height: 8px; border-radius: 4px; background: var(--bg-tertiary); overflow: hidden; margin: 4px 0 10px; }
    .bar span { display: block; height: 100%; border-radius: 4px; }
    .tour { display: grid; grid-template-columns: 112px 1fr; gap: 14px; padding: 12px 0; border-top: 1px solid var(--border-primary); }
    .tour:first-child { border-top: 0; padding-top: 0; }
    .tour:last-child { padding-bottom: 0; }
    .tour-thumb { width: 112px; height: 84px; border-radius: var(--r-md, 10px); background: var(--bg-secondary); border: 1px solid var(--border-primary); padding: 0; cursor: pointer; display: block; }
    .tour-thumb:hover, .tour-thumb:focus-visible { border-color: var(--text-muted); }
    .tour-thumb svg { width: 100%; height: 100%; display: block; }
    .tour-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
    .tour-head b { font-size: 14px; }
    .tour-head span { font-size: 12px; color: var(--text-muted); }
    .tour-figs { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 6px; }
    .tour-figs div { font-size: 13px; font-weight: 600; }
    .tour-figs small { display: block; font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--text-muted); }
    .tour-profile { width: 100%; height: 54px; display: block; margin-top: 8px; }
    .tour-pos { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
    @media (max-width: 520px) { .tour { grid-template-columns: 1fr; } .tour-thumb { width: 100%; height: 120px; } }
    .cat { display: flex; justify-content: space-between; font-size: 13px; gap: 8px; }
    .cat span:last-child { color: var(--text-muted); white-space: nowrap; }
    .result { font-size: 13px; padding: 10px 12px; border-radius: var(--r-sm, 8px); background: var(--accent-subtle); word-break: break-word; }
    .empty { padding: 48px 16px; text-align: center; color: var(--text-muted); }
    #generate { width: 100%; justify-content: center; }
    .skel { aspect-ratio: 640 / 380; border-radius: var(--r-md, 10px); }
  </style>
</head>
<body>
  <div class="scroller">
  <div class="wrap pending" id="wrap">
    <div class="head">
      <div class="trek-eyebrow" data-i18n="tripReport">Trip report</div>
      <h1 id="title" data-i18n="loading">Loading…</h1>
      <div class="trek-muted" id="dates"></div>
    </div>

    <div class="stats" id="stats">
      <div class="trek-card stat"><span class="trek-label" data-i18n="days">Days</span><b id="s-days">–</b></div>
      <div class="trek-card stat"><span class="trek-label" data-i18n="plannedStops">Planned stops</span><b id="s-stops">–</b></div>
      <div class="trek-card stat"><span class="trek-label" data-i18n="stays">Stays</span><b id="s-lodging">–</b></div>
      <div class="trek-card stat"><span class="trek-label" data-i18n="totalCost">Total cost</span><b id="s-cost">–</b></div>
    </div>

    <div class="grid">
      <div class="trek-stack">
        <div class="trek-card card">
          <div class="maphead">
            <div>
              <div class="trek-sectionhead" data-i18n="mapOverview">Map overview</div>
              <div class="viewname" id="viewname"></div>
            </div>
            <div class="viewstate" id="viewstate" aria-live="polite"></div>
          </div>
          <div id="map" class="mapbox"><div class="trek-skeleton skel"></div></div>
          <div class="maphint" data-i18n="mapHelp">Drag to move, Ctrl + scroll or pinch to zoom. The PDF shows each map as you frame it here.</div>
          <div class="pick">
            <div class="pickrow" id="pick-days"></div>
            <div class="pickrow" id="pick-tours" hidden></div>
          </div>
        </div>

        <div class="trek-card card" id="tours-card" hidden>
          <div class="trek-sectionhead" style="margin-bottom: 10px" data-i18n="tours">Tours</div>
          <div id="tours"></div>
        </div>

        <div class="trek-card card" id="costs-card" hidden>
          <div class="trek-sectionhead" style="margin-bottom: 10px" data-i18n="costs">Costs</div>
          <div id="costs"></div>
        </div>
      </div>

      <div class="side">
        <div class="trek-card card">
          <div class="trek-sectionhead" data-i18n="include">Include</div>
          <div class="opts">
            <label class="opt"><input type="checkbox" name="section" value="map" checked /><span><span data-i18n="mapOverview">Map overview</span><small data-i18n="mapHint">Whole trip + a map per day</small></span></label>
            <label class="opt"><input type="checkbox" name="section" value="timeline" checked /><span><span data-i18n="timeline">Timeline</span><small data-i18n="timelineHint">Each day hour by hour</small></span></label>
            <label class="opt"><input type="checkbox" name="section" value="itinerary" checked /><span><span data-i18n="itinerary">Itinerary</span><small data-i18n="itineraryHint">Day by day stops, times and notes</small></span></label>
            <label class="opt" id="tours-opt"><input type="checkbox" name="section" value="tours" checked /><span><span data-i18n="tours">Tours</span><small id="tours-hint" data-i18n="toursHint">Route map, distance and elevation profile</small></span></label>
            <label class="opt"><input type="checkbox" name="section" value="lodging" checked /><span><span data-i18n="accommodation">Accommodation</span><small id="lodging-hint" data-i18n="accommodationHint">Check-in, check-out, nights</small></span></label>
            <label class="opt" id="costs-opt"><input type="checkbox" name="section" value="costs" checked /><span><span data-i18n="costs">Costs</span><small id="costs-hint" data-i18n="costsHint">Totals by category + every expense</small></span></label>
          </div>

          <div class="optrow">
            <div id="tour-detail-box" hidden>
              <div class="trek-sectionhead" data-i18n="tourDetail">Tour detail</div>
              <div class="trek-segmented" id="tour-detail">
                <button type="button" data-v="compact" aria-pressed="true" data-i18n="compact">Compact</button>
                <button type="button" data-v="full" aria-pressed="false" data-i18n="detailed">Detailed</button>
              </div>
            </div>
            <div>
              <div class="trek-sectionhead" data-i18n="paper">Paper</div>
              <div class="trek-segmented" id="paper">
                <button type="button" data-v="a4" aria-pressed="true">A4</button>
                <button type="button" data-v="letter" aria-pressed="false" data-i18n="letter">Letter</button>
              </div>
            </div>
          </div>

          <div style="margin-top: 16px">
            <button class="trek-btn trek-btn--primary" id="generate" disabled data-i18n="generate">Generate PDF</button>
          </div>
          <p class="trek-faint" style="font-size: 12px; margin: 10px 0 0" data-i18n="savedNote">The PDF is saved to this trip’s Files, where everyone on the trip can open or download it.</p>
          <div class="result" id="result" hidden></div>
        </div>
      </div>
    </div>
  </div>
  </div>

  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var NS = 'http://www.w3.org/2000/svg';
      var COLORS = ['#e11d48', '#2563eb', '#16a34a', '#d97706', '#7c3aed', '#0891b2', '#db2777', '#65a30d', '#ea580c', '#4f46e5'];
      var ctx = null, loadedFor = null, summary = null;
      var S = {}, plural = null, LOCALE = 'en-US';

      // ---- i18n: strings come from the server (one table shared with the PDF).
      function t(key, vars) {
        var s = S[key] != null ? S[key] : key;
        return String(s).replace(/\{(\w+)\}/g, function (m, k) { return vars && vars[k] != null ? vars[k] : m; });
      }
      function tn(key, n) {
        var forms = S[key] || {}, cat = plural ? plural.select(n) : 'other';
        return String(forms[cat] || forms.other || '{n}').replace('{n}', n.toLocaleString(LOCALE));
      }
      function applyI18n(b) {
        S = b.strings; LOCALE = b.locale;
        try { plural = new Intl.PluralRules(LOCALE); } catch (e) { plural = null; }
        document.documentElement.lang = b.lang;
        document.documentElement.dir = b.dir;
        document.querySelectorAll('[data-i18n]').forEach(function (n) { n.textContent = t(n.getAttribute('data-i18n')); });
      }
      function reveal() { $('wrap').classList.remove('pending'); }

      function el(tag, attrs, parent) {
        var e = document.createElementNS(NS, tag);
        for (var k in attrs) e.setAttribute(k, attrs[k]);
        if (parent) parent.appendChild(e);
        return e;
      }
      function h(tag, cls, parent, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text != null) e.textContent = text;
        if (parent) parent.appendChild(e);
        return e;
      }
      function opts() {
        var f = (ctx && ctx.formats) || {};
        return { tripId: ctx && ctx.tripId, lang: (ctx && ctx.locale) || f.locale || 'en', locale: f.locale, currency: f.currency, timeZone: f.timezone };
      }
      function unwrap(data) {
        if (data && data.error) throw new Error(data.error);
        return data;
      }

      // ---- What the user framed and picked: map views per trip ({ all | d<dayId> | t<tour>:
      // [cx, cy, k] }) and the tab's choices. Saved to the plugin's own storage on the server
      // (survives reloads and other devices); if that isn't available, to this browser tab.
      var views = {}, choices = { style: null, tourDetail: 'compact', paper: 'a4', sections: null };
      var serverStore = false, pending = { views: {}, prefs: {} }, flushTimer = null;
      function persist(viewPatch, prefPatch) {
        for (var k in viewPatch || {}) pending.views[k] = viewPatch[k];
        for (var p in prefPatch || {}) pending.prefs[p] = prefPatch[p];
        clearTimeout(flushTimer);
        flushTimer = setTimeout(flush, 600);
      }
      function flush() {
        clearTimeout(flushTimer);
        var batch = pending; pending = { views: {}, prefs: {} };
        if (!Object.keys(batch.views).length && !Object.keys(batch.prefs).length) return;
        var o = opts();
        if (!o.tripId) return;
        if (serverStore) {
          var body = { tripId: o.tripId, views: batch.views, prefs: batch.prefs };
          trek.invoke('/prefs', { method: 'POST', body: body }).then(unwrap).then(function (r) {
            if (!r.stored) { serverStore = false; sessionSave(); }
            showViewState();
          }).catch(function () { serverStore = false; sessionSave(); });
        } else sessionSave();
      }
      function sessionSave() {
        if (!trek.session) return;
        trek.session.set('prefs', choices).catch(function () {});
        // One value per scope is capped at 1 KiB: keep as many views as fit, the open one first.
        var keep = {}, keys = [view].concat(Object.keys(views).filter(function (k) { return k !== view; })).filter(function (k) { return views[k]; });
        keys.forEach(function (k) { keep[k] = views[k]; if (JSON.stringify(keep).length > 1000) delete keep[k]; });
        trek.session.set('views', keep, { scope: 'trip' }).catch(function () {});
      }
      function sessionLoad() {
        if (!trek.session) return Promise.resolve();
        return Promise.all([
          trek.session.get('prefs').catch(function () { return null; }),
          trek.session.get('views', { scope: 'trip' }).catch(function () { return null; }),
        ]).then(function (r) {
          if (r[0] && typeof r[0] === 'object') for (var k in r[0]) if (r[0][k] != null) choices[k] = r[0][k];
          if (r[1] && typeof r[1] === 'object') for (var v in r[1]) if (validView(r[1][v]) && !views[v]) views[v] = r[1][v];
        });
      }
      window.addEventListener('pagehide', flush);
      document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') flush(); });
      function validView(v) { return Array.isArray(v) && v.length === 3 && v.every(function (n) { return typeof n === 'number' && isFinite(n); }) && v[2] > 0; }

      // ---- Interactive map. The server sends lat/lng for every marker and route; the tab
      // projects them itself (Web Mercator) so zoom and pan are instant, and asks the server
      // for a fresh basemap once the view settles. Until it arrives, the previous basemap is
      // scaled/shifted into place so nothing jumps.
      var R = 6371008.8, K_MIN = 512 * 2 / (2 * Math.PI), K_MAX = 512 * Math.pow(2, 17) / (2 * Math.PI);
      var view = 'all', M = null, cur = null, svg = null, gBase = null, gTop = null, baseView = null, baseHalo = '#ffffff';
      var baseTimer = null, baseSeq = 0, baseCache = {}, baseKeys = [], style = 'bright', attrOpen = false;
      var mx = function (lng) { return lng * Math.PI / 180; };
      var my = function (lat) { return Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360)); };
      var clamp = function (v, lo, hi) { return Math.min(hi, Math.max(lo, v)); };
      function P(ll) { return [M.w / 2 + (mx(ll[1]) - cur.cx) * cur.k, M.h / 2 - (my(ll[0]) - cur.cy) * cur.k]; }
      // Rough label width: CJK/Thai/Hangul glyphs are about twice as wide as Latin ones.
      function textW(s, size) { var w = 0; for (var i = 0; i < s.length; i++) w += /[ᄀ-ᇿ⺀-鿿가-힯豈-﫿＀-￯]/.test(s[i]) ? 1 : 0.58; return w * size; }

      function remember() {
        var val = [+cur.cx.toFixed(7), +cur.cy.toFixed(7), +cur.k.toFixed(2)], patch = {};
        views[view] = val; patch[view] = val;
        persist(patch);
        showViewState();
      }
      function forget() {
        var patch = {}; patch[view] = null;
        delete views[view];
        persist(patch);
        setView(M.view, 0, true);
        showViewState();
      }

      function scaleBar() {
        var lat = Math.atan(Math.exp(cur.cy)) * 360 / Math.PI - 90;
        var mPerPt = R * Math.cos(lat * Math.PI / 180) / cur.k, target = (M.w / 5) * mPerPt;
        var mag = Math.pow(10, Math.floor(Math.log10(target)));
        var dist = [1, 2, 5, 10].map(function (f) { return f * mag; }).filter(function (v) { return v <= target; }).pop() || mag;
        return { len: dist / mPerPt, label: dist >= 1000 ? (dist / 1000).toLocaleString(LOCALE) + ' km' : dist.toLocaleString(LOCALE) + ' m' };
      }

      // Space basemap labels must keep clear of: markers, scale bar, credit, the map controls.
      function markerBoxes() {
        return M.markers.map(function (k) { var p = P([k.lat, k.lng]); return [p[0] - 12, p[1] - 12, p[0] + 12, p[1] + 12]; })
          .concat([[M.w - 150, M.h - 30, M.w, M.h], [0, M.h - 16, 40, M.h], [0, 0, 46, 112], [M.w - 150, 0, M.w, 46]]);
      }

      function requestBase(delay) {
        clearTimeout(baseTimer);
        if (!summary || !summary.basemap || !svg) return;
        baseTimer = setTimeout(function () {
          var v = { cx: cur.cx, cy: cur.cy, k: cur.k }, seq = ++baseSeq, map = svg;
          var key = [style, v.cx.toFixed(6), v.cy.toFixed(6), v.k.toFixed(1), LOCALE].join('|');
          if (!baseCache[key]) {
            var body = opts(); body.view = v; body.style = style; body.reserved = markerBoxes();
            body.scale = Math.min(2, window.devicePixelRatio || 1); // raster style resolution
            baseCache[key] = trek.invoke('/basemap', { method: 'POST', body: body })
              .then(unwrap).then(function (r) { return r && r.basemap ? r.basemap : null; })
              .catch(function () { delete baseCache[key]; return null; });
            baseKeys.push(key);
            if (baseKeys.length > 24) delete baseCache[baseKeys.shift()];
          }
          baseCache[key].then(function (b) {
            if (!b || seq !== baseSeq || map !== svg) return;
            paintBase(b);
            baseView = v;
            redraw();
          });
        }, delay);
      }

      function paintBase(b) {
        gBase.textContent = '';
        gBase.removeAttribute('transform');
        baseHalo = b.halo || '#ffffff';
        svg.style.background = b.background;
        el('rect', { x: -M.w, y: -M.h, width: M.w * 3, height: M.h * 3, fill: b.background }, gBase);

      function sectionInputs() { return Array.prototype.slice.call(document.querySelectorAll('input[name=section]')); }
      function setSegmented(id, v) {
        document.querySelectorAll('#' + id + ' button').forEach(function (x) { x.setAttribute('aria-pressed', String(x.dataset.v === v)); });
      }
      function applyChoices(s) {
        setSegmented('tour-detail', choices.tourDetail);
        setSegmented('paper', choices.paper);
        if (Array.isArray(choices.sections)) sectionInputs().forEach(function (i) { i.checked = choices.sections.indexOf(i.value) >= 0; });
        var avail = { tours: !!s.tours, costs: !!s.costsEnabled };
        sectionInputs().forEach(function (i) {
          var off = avail[i.value] === false;
          i.disabled = off;
          i.closest('.opt').setAttribute('aria-disabled', String(off));
        });
        $('tour-detail-box').hidden = !s.tours || !document.querySelector('input[value=tours]').checked;
      }
      sectionInputs().forEach(function (i) {
        i.addEventListener('change', function () {
          choices.sections = sectionInputs().filter(function (x) { return x.checked; }).map(function (x) { return x.value; });
          persist(null, { sections: choices.sections });
          if (summary) $('tour-detail-box').hidden = !summary.tours || !document.querySelector('input[value=tours]').checked;
        });
      });
      [['tour-detail', 'tourDetail'], ['paper', 'paper']].forEach(function (pair) {
        document.querySelectorAll('#' + pair[0] + ' button').forEach(function (b) {
          b.addEventListener('click', function () {
            choices[pair[1]] = b.dataset.v;
            setSegmented(pair[0], b.dataset.v);
            var patch = {}; patch[pair[1]] = b.dataset.v;
            persist(null, patch);
          });
        });
      });

      function render(s) {
        applyI18n(s.i18n);
        summary = s;
        $('title').textContent = s.title;
        $('dates').textContent = [s.dateRange, s.duration ? tn('nDays', s.duration) : ''].filter(Boolean).join(' · ') || t('noDates');
        $('s-days').textContent = s.days.toLocaleString(LOCALE);
        $('s-stops').textContent = s.stops.toLocaleString(LOCALE) + (s.unscheduled ? ' (+' + s.unscheduled.toLocaleString(LOCALE) + ')' : '');
        $('s-lodging').textContent = s.lodging.toLocaleString(LOCALE);
        $('s-cost').textContent = s.costs && s.costs.length ? s.costs[0].formatted + (s.costs.length > 1 ? ' +' : '') : '—';
        $('s-cost').title = s.costs ? s.costs.map(function (c) { return c.formatted; }).join(' + ') : '';
        $('costs-hint').textContent = s.costsEnabled ? (s.costItems ? tn('nExpenses', s.costItems) : t('noExpenses')) : t('costsOff');
        $('lodging-hint').textContent = s.lodging ? tn('nStays', s.lodging) : t('noLodging');
        $('tours-hint').textContent = s.tours ? tn('nTours', s.tours) : t('noTours');
        style = s.style;
        applyChoices(s);
        buildPicker();
        showView(view);
        renderTours(s);
        renderCosts(s);
        $('generate').disabled = false;
        reveal();
      }

      function load() {
        var o = opts();
        if (!o.tripId) { $('title').textContent = t('openTrip'); reveal(); return; }
        var key = JSON.stringify(o);
        if (key === loadedFor) return;
        var newTrip = !loadedFor || JSON.parse(loadedFor).tripId !== o.tripId;
        if (newTrip) { flush(); views = {}; view = 'all'; }
        loadedFor = key;
        baseCache = {}; baseKeys = [];
        trek.invoke('/summary', { method: 'POST', body: o }).then(unwrap).then(function (s) {
          serverStore = !!s.saved;
          if (s.saved) {
            for (var v in s.saved.views) if (!views[v]) views[v] = s.saved.views[v];
            for (var p in s.saved.prefs) choices[p] = s.saved.prefs[p];
            return s;
          }
          return sessionLoad().then(function () {
            if (choices.style && s.styles.some(function (x) { return x.id === choices.style; })) s.style = choices.style;
            return s;
          });
        }).then(render).catch(function (e) {
          loadedFor = null;
          $('title').textContent = t('couldNotLoad');
          $('map').textContent = '';
          h('div', 'empty', $('map'), e.message);
          reveal();
          trek.notify('error', e.message);
        });
      }

      $('generate').addEventListener('click', function () {
        var sections = sectionInputs().filter(function (i) { return i.checked && !i.disabled; }).map(function (i) { return i.value; });
        if (!sections.length) { trek.notify('warning', t('pickSection')); return; }
        flush();
        var btn = $('generate'), res = $('result');
        btn.disabled = true; btn.textContent = t('generating'); res.hidden = true;
        var body = opts();
        body.sections = sections; body.paper = choices.paper; body.tourDetail = choices.tourDetail; body.style = style; body.views = views;
        trek.invoke('/report', { method: 'POST', body: body }).then(unwrap).then(function (r) {
          var kb = Math.max(1, Math.round(r.file.size / 1024));
          res.hidden = false;
          res.textContent = t('savedTo', { name: r.file.name, kb: kb.toLocaleString(LOCALE) });
          trek.notify('success', t('savedToast'));
        }).catch(function (e) {
          res.hidden = false;
          res.textContent = t('couldNotCreate', { msg: e.message });
          trek.notify('error', e.message);
        }).then(function () { btn.disabled = false; btn.textContent = t('generate'); });
      });

      // Never stay invisible if the host is slow to send a context.
      setTimeout(reveal, 3000);
      trek.onContext(function (c) { ctx = c; load(); });
    })();
  </script>
</body>
</html>
